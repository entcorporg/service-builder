[package]
name = "sb-app"
description = "Application services shared by the desktop app and the CLI: analyze, open, save, export."
version.workspace = true
edition.workspace = true

[dependencies]
sb-codegen = { path = "../sb-codegen" }
sb-model = { path = "../sb-model" }
serde.workspace = true
serde_json.workspace = true
# The project store speaks S3 (Garage) with a small client of its own: requests signed with SigV4.
ureq = "3"
sha2 = "0.10"
hmac = "0.12"

[[bin]]
name = "sb"
path = "src/bin/sb.rs"
