[package]
name = "service-builder"
description = "Visual builder for event-driven Rust backends (gRPC + Kafka)"
version.workspace = true
edition.workspace = true

[lib]
name = "sb_egui"
path = "src/lib.rs"

[[bin]]
name = "service-builder"
path = "src/main.rs"

[dependencies]
sb-app = { path = "../sb-app" }
sb-model = { path = "../sb-model" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
egui_extras = { version = "0.37", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18"
minisign-verify = "0.3"
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
