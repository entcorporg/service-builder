[package]
name = "eda-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
prost.workspace = true
rdkafka.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rand.workspace = true
hex.workspace = true
hmac.workspace = true
sha1.workspace = true
webauthn-rs = { workspace = true, optional = true }
webauthn-authenticator-rs = { workspace = true, optional = true }

[features]
# Passkeys bring OpenSSL in: only the services that have a passkey step turn this on.
webauthn = ["dep:webauthn-rs"]
# The tests of the passkeys, against a software authenticator.
webauthn-tests = ["webauthn", "dep:webauthn-authenticator-rs"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
