[package]
name = "eda-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
prost.workspace = true
rdkafka.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rand.workspace = true
hex.workspace = true
hmac.workspace = true
sha1.workspace = true
zxcvbn = { workspace = true, optional = true }
ammonia = { workspace = true, optional = true }
sqids = { workspace = true, optional = true }
webauthn-rs = { workspace = true, optional = true }
webauthn-authenticator-rs = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[features]
# Events for the browsers (`publishLive`) bring the Redis client in: only the services that have such a step turn this on.
live = ["dep:redis"]
# A `rateLimit` that counts in the key-value server (`shared`) brings the Redis client in too.
shared-limit = ["dep:redis"]
# Judging a password (`passwordStrength`) brings the estimator and, for the check against known breaches, the HTTP client in.
password-strength = ["dep:zxcvbn", "dep:reqwest"]
# Cleaning an HTML text (`sanitizeHtml`) brings the HTML parser in: only the services that use it build it.
html = ["dep:ammonia"]
# Short identifiers (`shortId`, `fromShortId`) bring Sqids in: only the services that use them build it.
short-id = ["dep:sqids"]
# Passkeys bring OpenSSL in: only the services that have a passkey step turn this on.
webauthn = ["dep:webauthn-rs"]
# The tests of the passkeys, against a software authenticator.
webauthn-tests = ["webauthn", "dep:webauthn-authenticator-rs"]
# Object storage brings the AWS SDK in: only the services that have an object step turn this on.
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
# The tests of the object storage, against a fake S3 on a local port.
s3-tests = ["s3", "dep:axum"]
# Outbound HTTP calls (`httpCall`) bring the HTTP client in: only the services that have such a step turn this on.
http-client = ["dep:reqwest"]
# The tests of the outbound calls, against a fake API on a local port.
http-client-tests = ["http-client", "dep:axum"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
