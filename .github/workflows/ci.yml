name: CI

# A branch is tested once, through its pull request; main is tested on every push. CI only tests: nothing is built or
# released here (the app is built on the developer's machine, scripts/install-local.sh).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces the run in progress. Main is never cancelled: a release hangs on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Where the checks run: GitHub-hosted runners. A self-hosted runner (label `service-builder`) can take over by
# changing `runs-on` back; the steps below already handle both (`runner.environment`).

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - run: node --test scripts/release.test.mjs
      - run: node scripts/release.mjs check

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  generated-workspace:
    # The code we generate must compile, not just look right.
    runs-on: ubuntu-24.04
    services:
      # For the rate limit counted in a shared store (`rateLimit` with `shared`).
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly
        ports:
          - 6379:6379
        options: --ulimit memlock=-1
      # For the uses metered against quotas (`meter` and `checkQuota`).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - name: Build tools for librdkafka
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libssl-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p sb-codegen --example dump -- "$RUNNER_TEMP/generated"
      - run: cargo check --workspace
        working-directory: ${{ runner.temp }}/generated
        env:
          # runner.temp is wiped between jobs; the tool cache is not, so librdkafka is built once.
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
      # What the generated code does without any infrastructure: the JSON forms of bytes and timestamps, the checks of the
      # required fields, the response headers of the runtime.
      # Quoted: a line that ends with a colon would be read as a key.
      - run: "cargo test -p contracts -p orders && cargo test -p eda-runtime --lib http::"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
      # The shared rate limit: its own tests, then against the DragonflyDB above (the attempts must be counted in the server).
      - run: "cargo test -p eda-runtime --features shared-limit --lib rate_limit && cargo test -p eda-runtime --features shared-limit --lib rate_limit -- --ignored"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
          DRAGONFLY_URL: redis://localhost:6379
      # The meters and quotas against a real PostgreSQL: the periods, the view, the idempotency keys and the lock that keeps two
      # requests from taking the last unit. The proof-of-work challenges: a solution is worth one form, for every replica. The API keys: only the hash is stored, one 401 whatever is wrong. The numbers without a gap: a failed run gives its number back. The audit journal: append-only, read by company, page by page. The feature flags: a row an operator changes, never overwritten by a deployment.
      - run: "cargo test -p eda-runtime --lib -- --include-ignored usage:: challenge:: api_key:: sequence:: audit:: flags::"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
          EDA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The judgment of a password: the estimator, and the range API for known breaches against a server of the test's own.
      - run: "cargo test -p eda-runtime --features http-client-tests --lib -- resilience:: http_client::"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
      # The circuit breaker and the bulkhead of the outbound calls (and the client itself), against a fake API on a local port.
      - run: "cargo test -p eda-runtime --features time-zones --lib time_zone::"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
      # Calendar arithmetic in a zone: the days of 23 and 25 hours, the end of a month, the time that does not exist.
      - run: "cargo test -p eda-runtime --features short-id --lib -- short_id:: logic::"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
      # The short identifiers (Sqids) and the UUIDs that sort by time.
      - run: "cargo test -p eda-runtime --features html --lib html::"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
      # The HTML sanitizer: scripts, event attributes and `javascript:` links go, the formatting stays.
      - run: "cargo test -p eda-runtime --features password-strength --lib password::"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
      # The OpenAPI document of each service, against the OpenAPI 3.1 specification.
      - name: Validate the OpenAPI documents
        run: |
          python3 -m venv "$RUNNER_TEMP/oas"
          "$RUNNER_TEMP/oas/bin/pip" install --quiet openapi-spec-validator
          for doc in "$RUNNER_TEMP"/generated/services/*/openapi.json; do
            "$RUNNER_TEMP/oas/bin/python" -m openapi_spec_validator "$doc"
          done

      # The AsyncAPI document of the topics, with the official parser.
      - name: Validate the AsyncAPI document
        run: |
          mkdir -p "$RUNNER_TEMP/asyncapi" && cd "$RUNNER_TEMP/asyncapi"
          npm init -y >/dev/null && npm install --silent @asyncapi/parser@3
          cp "$GITHUB_WORKSPACE/scripts/validate-asyncapi.mjs" .
          node validate-asyncapi.mjs "$RUNNER_TEMP/generated/asyncapi.yaml"

  generated-realtime:
    # The real-time service is tested for real: its own tests, then the whole of it against a DragonflyDB, over real sockets.
    # It needs neither Kafka nor a database, so none of the C toolchain of the other services is built here.
    runs-on: ubuntu-24.04
    services:
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly
        ports:
          - 6379:6379
        options: --ulimit memlock=-1
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p sb-codegen --example dump -- "$RUNNER_TEMP/generated"
      - run: cargo test -p realtime -- --test-threads=4
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-realtime-target
      - run: cargo test -p realtime --test dragonfly -- --ignored --test-threads=1
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-realtime-target
          REALTIME_TEST_DRAGONFLY_URL: redis://localhost:6379
