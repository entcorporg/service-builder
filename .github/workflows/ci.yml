name: CI

# A branch is tested once, through its pull request; main is tested on every push (it releases).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces the run in progress. Main is never cancelled: a release hangs on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Where the checks run: GitHub-hosted runners. A self-hosted runner (label `service-builder`) can take over by
# changing `runs-on` back; the steps below already handle both (`runner.environment`).

jobs:
  # Rule 1 — every change names its update type: [minor] 0.0.X, [normal] 0.X.0, [major] X.0.0,
  # in the title of the pull request or in the subject line (first line) of a commit. Only titles
  # count: a description or commit body that merely talks about the mentions must not release.
  # A pull request without the mention fails here; a push to main reads it to decide the release.
  update-type:
    runs-on: ubuntu-24.04
    outputs:
      level: ${{ steps.detect.outputs.level }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: ${{ runner.environment == 'github-hosted' }}
      - id: detect
        # Texts reach the script through the environment, never interpolated into the shell.
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            text="$PR_TITLE"$'\n'"$(git log --format=%s "$PR_BASE..$PR_HEAD")"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            text="$(git log --format=%s "$BEFORE..$SHA")"
          else
            text="$(git log -1 --format=%s "$SHA")"
          fi
          level="$(printf '%s' "$text" | node scripts/release.mjs detect)"
          echo "level=$level" >> "$GITHUB_OUTPUT"
          if [ -n "$level" ]; then
            echo "Update type: $level"
          elif [ "$EVENT" = pull_request ]; then
            echo "::error title=Update type missing::Mention [minor] (0.0.X), [normal] (0.X.0) or [major] (X.0.0) in the PR title or in the first line of a commit."
            exit 1
          elif [ "$BRANCH" = main ]; then
            echo "::notice title=No release::No [minor], [normal] or [major] mention in this push: the version is left as is."
          fi

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - run: node --test scripts/release.test.mjs
      - run: node scripts/release.mjs check

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  generated-workspace:
    # The code we generate must compile, not just look right.
    runs-on: ubuntu-24.04
    services:
      # For the rate limit counted in a shared store (`rateLimit` with `shared`).
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly
        ports:
          - 6379:6379
        options: --ulimit memlock=-1
      # For the uses metered against quotas (`meter` and `checkQuota`).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - name: Build tools for librdkafka
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libssl-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p sb-codegen --example dump -- "$RUNNER_TEMP/generated"
      - run: cargo check --workspace
        working-directory: ${{ runner.temp }}/generated
        env:
          # runner.temp is wiped between jobs; the tool cache is not, so librdkafka is built once.
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
      # What the generated code does without any infrastructure: the JSON forms of bytes and timestamps, the checks of the
      # required fields, the response headers of the runtime.
      # Quoted: a line that ends with a colon would be read as a key.
      - run: "cargo test -p contracts -p orders && cargo test -p eda-runtime --lib http::"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
      # The shared rate limit: its own tests, then against the DragonflyDB above (the attempts must be counted in the server).
      - run: "cargo test -p eda-runtime --features shared-limit --lib rate_limit && cargo test -p eda-runtime --features shared-limit --lib rate_limit -- --ignored"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
          DRAGONFLY_URL: redis://localhost:6379
      # The meters and quotas against a real PostgreSQL: the periods, the view, the idempotency keys and the lock that keeps two
      # requests from taking the last unit. The proof-of-work challenges: a solution is worth one form, for every replica. The API keys: only the hash is stored, one 401 whatever is wrong.
      - run: "cargo test -p eda-runtime --lib -- --include-ignored usage:: challenge:: api_key::"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
          EDA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The judgment of a password: the estimator, and the range API for known breaches against a server of the test's own.
      - run: "cargo test -p eda-runtime --features http-client-tests --lib -- resilience:: http_client::"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
      # The circuit breaker and the bulkhead of the outbound calls (and the client itself), against a fake API on a local port.
      - run: "cargo test -p eda-runtime --features html --lib html::"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
      # The HTML sanitizer: scripts, event attributes and `javascript:` links go, the formatting stays.
      - run: "cargo test -p eda-runtime --features password-strength --lib password::"
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-target
      # The OpenAPI document of each service, against the OpenAPI 3.1 specification.
      - name: Validate the OpenAPI documents
        run: |
          python3 -m venv "$RUNNER_TEMP/oas"
          "$RUNNER_TEMP/oas/bin/pip" install --quiet openapi-spec-validator
          for doc in "$RUNNER_TEMP"/generated/services/*/openapi.json; do
            "$RUNNER_TEMP/oas/bin/python" -m openapi_spec_validator "$doc"
          done

      # The AsyncAPI document of the topics, with the official parser.
      - name: Validate the AsyncAPI document
        run: |
          mkdir -p "$RUNNER_TEMP/asyncapi" && cd "$RUNNER_TEMP/asyncapi"
          npm init -y >/dev/null && npm install --silent @asyncapi/parser@3
          cp "$GITHUB_WORKSPACE/scripts/validate-asyncapi.mjs" .
          node validate-asyncapi.mjs "$RUNNER_TEMP/generated/asyncapi.yaml"

  generated-realtime:
    # The real-time service is tested for real: its own tests, then the whole of it against a DragonflyDB, over real sockets.
    # It needs neither Kafka nor a database, so none of the C toolchain of the other services is built here.
    runs-on: ubuntu-24.04
    services:
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly
        ports:
          - 6379:6379
        options: --ulimit memlock=-1
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p sb-codegen --example dump -- "$RUNNER_TEMP/generated"
      - run: cargo test -p realtime -- --test-threads=4
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-realtime-target
      - run: cargo test -p realtime --test dragonfly -- --ignored --test-threads=1
        working-directory: ${{ runner.temp }}/generated
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/sb-generated-realtime-target
          REALTIME_TEST_DRAGONFLY_URL: redis://localhost:6379

  # Rule 2 — a push to main that carries a mention raises the version (0.1.0 + [normal] = 0.2.0),
  # commits it and tags it. The commit made with GITHUB_TOKEN does not start another run.
  bump:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.update-type.outputs.level != ''
    needs: [update-type, scripts, rust, generated-workspace]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Two pushes in a row must not bump the same version twice.
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      # The tip of main, not the tested commit: an earlier release may have moved it since.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: bump
        env:
          LEVEL: ${{ needs.update-type.outputs.level }}
        run: |
          version="$(node scripts/release.mjs bump "$LEVEL")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$version [skip ci]"
          git tag "v$version"
          git push origin main "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  # Builds the AppImage, signs it, and publishes the GitHub release the app polls for updates.
  publish:
    needs: [update-type, bump]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - name: AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2t64 file desktop-file-utils minisign
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p service-builder
      - name: AppImage
        run: scripts/appimage.sh "${{ needs.bump.outputs.tag }}"
      - name: Sign
        # The key is the one of the earlier releases (a base64 minisign secret key file): the public key in
        # crates/sb-egui/src/updater.rs is unchanged, so installed builds keep updating.
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # minisign reads the password from stdin when there is no terminal (rsign wants /dev/tty, which a runner has
        # not). Its signatures are prehashed, the only kind the updater accepts.
        run: |
          umask 077
          printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/minisign.key"
          for image in dist/*.AppImage; do
            printf '%s\n' "$PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$image" -x "$image.minisig"
          done
          rm -f "$RUNNER_TEMP/minisign.key"
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump.outputs.tag }}
          LEVEL: ${{ needs.update-type.outputs.level }}
        run: |
          gh release create "$TAG" dist/*.AppImage dist/*.AppImage.minisig \
            --title "Service Builder $TAG" \
            --notes "Mise à jour $LEVEL. Le détail est dans l’historique des commits."
