name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Rule 1 — every change names its update type: [minor] 0.0.X, [normal] 0.X.0, [major] X.0.0,
  # in the title of the pull request or in the subject line (first line) of a commit. Only titles
  # count: a description or commit body that merely talks about the mentions must not release.
  # A pull request without the mention fails here; a push to main reads it to decide the release.
  update-type:
    runs-on: ubuntu-24.04
    outputs:
      level: ${{ steps.detect.outputs.level }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        # Texts reach the script through the environment, never interpolated into the shell.
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            text="$PR_TITLE"$'\n'"$(git log --format=%s "$PR_BASE..$PR_HEAD")"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            text="$(git log --format=%s "$BEFORE..$SHA")"
          else
            text="$(git log -1 --format=%s "$SHA")"
          fi
          level="$(printf '%s' "$text" | node scripts/release.mjs detect)"
          echo "level=$level" >> "$GITHUB_OUTPUT"
          if [ -n "$level" ]; then
            echo "Update type: $level"
          elif [ "$EVENT" = pull_request ]; then
            echo "::error title=Update type missing::Mention [minor] (0.0.X), [normal] (0.X.0) or [major] (X.0.0) in the PR title or in the first line of a commit."
            exit 1
          elif [ "$BRANCH" = main ]; then
            echo "::notice title=No release::No [minor], [normal] or [major] mention in this push: the version is left as is."
          fi

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/release.test.mjs
      - run: node scripts/release.mjs check

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  generated-workspace:
    # The code we generate must compile, not just look right.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build tools for librdkafka
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libssl-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p sb-codegen --example dump -- "$RUNNER_TEMP/generated"
      - run: cargo check --workspace
        working-directory: ${{ runner.temp }}/generated

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ui typecheck
      - run: pnpm --dir ui test
      - run: pnpm --dir ui build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ui exec playwright install --with-deps chromium
      - run: cargo build -p sb-app --bin sb
      - run: pnpm --dir ui e2e

  # Rule 2 — a push to main that carries a mention raises the version (0.1.0 + [normal] = 0.2.0),
  # commits it and tags it. The commit made with GITHUB_TOKEN does not start another run.
  bump:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.update-type.outputs.level != ''
    needs: [update-type, scripts, rust, generated-workspace, ui, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Two pushes in a row must not bump the same version twice.
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      # The tip of main, not the tested commit: an earlier release may have moved it since.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: bump
        env:
          LEVEL: ${{ needs.update-type.outputs.level }}
        run: |
          version="$(node scripts/release.mjs bump "$LEVEL")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$version [skip ci]"
          git tag "v$version"
          git push origin main "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  # Builds the signed bundles and publishes the GitHub release whose latest.json the app polls.
  publish:
    needs: [update-type, bump]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config build-essential patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the matching public key is in src-tauri/tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.bump.outputs.tag }}
          releaseName: Service Builder ${{ needs.bump.outputs.tag }}
          releaseBody: "Mise à jour ${{ needs.update-type.outputs.level }}. Le détail est dans l’historique des commits."
          includeUpdaterJson: true
